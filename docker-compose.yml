version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: baena_barber_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: barberia
      POSTGRES_PASSWORD: barberia123
      POSTGRES_DB: barberia_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barberia -d barberia_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: baena_barber_api
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: barberia
      DB_PASSWORD: barberia123
      DB_NAME: barberia_db
      PORT: 4000
      BARBERSHOP_WHATSAPP: "573001234567"
      BARBERSHOP_PHONE: "+573001234567"
      ADMIN_USER: admin
      ADMIN_PASSWORD: baena2026
      JWT_SECRET: baena-barber-compose-secret
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: baena_barber_ui
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:4000/api
      VITE_WHATSAPP: "573001234567"
      VITE_PHONE: "+573001234567"
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
